[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safeyolo"
version = "1.0.0"
description = "基于 Ultralytics YOLO 的安全帽检测训练工具：数据准备、训练、评估、推理一条龙"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "ponm3ay" }]
requires-python = ">=3.9"
keywords = ["yolo", "object-detection", "safety-helmet", "ultralytics", "ppe"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "ultralytics>=8.2.0",
    "PyYAML>=6.0",
    "colorlog>=6.7",
    "scikit-learn>=1.3",
    "opencv-python>=4.8",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
safeyolo = "safeyolo.cli:main"

[project.urls]
Homepage = "https://github.com/ponm3ay/safeyolo"
Issues = "https://github.com/ponm3ay/safeyolo/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/safeyolo"]

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
