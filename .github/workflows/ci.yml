name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 测试只覆盖不依赖 torch 的模块（转换器 / 数据准备 / 配置），
      # 不安装 ultralytics / torch 以保持 CI 轻量
      - run: pip install pytest pyyaml colorlog scikit-learn
      - run: pip install -e . --no-deps
      - run: pytest tests -v
